{% extends "base.html" %}
{% block title %}상품 둘러보기 · Deuce Market{% endblock %}

{% block content %}
<h1>상품 둘러보기</h1>

<form class="filter-bar" action="{{ url_for('products.index') }}" method="get">
  <input type="text" name="q" value="{{ query }}" placeholder="검색어" maxlength="100">
  <select name="category">
    <option value="">전체 카테고리</option>
    {% for c in categories %}
      <option value="{{ c }}" {% if c == selected_category %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
  </select>
  <button type="submit">검색</button>
</form>

{% if products %}
  <div class="product-grid">
    {% for p in products %}
      {% include "products/_card.html" %}
    {% endfor %}
  </div>
{% else %}
  <p class="empty">조건에 맞는 상품이 없습니다.</p>
{% endif %}
{% endblock %}
