{% extends "base.html" %}
{% block title %}회원가입 · Deuce Market{% endblock %}

{% block content %}
<div class="auth-box">
  <h1>회원가입</h1>
  <form class="form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>아이디
      <input type="text" name="username" minlength="4" maxlength="20" required
             pattern="[A-Za-z0-9_]+" title="영문/숫자/밑줄 4~20자">
    </label>
    <label>비밀번호
      <input type="password" name="password" minlength="8" required>
    </label>
    <button class="btn" type="submit">가입하기</button>
  </form>
  <p>이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
</div>
{% endblock %}
