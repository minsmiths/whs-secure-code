{% extends "base.html" %}
{% block title %}회원가입 · Deuce Market{% endblock %}

{% block body %}
<main class="auth">
  <div class="auth-logo">🎾</div>
  <h1>회원가입</h1>
  <p class="auth-sub">30초면 가입 완료!</p>

  <form class="form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>아이디</label>
      <input type="text" name="username" minlength="4" maxlength="20" required autofocus
             pattern="[A-Za-z0-9_]+" title="영문/숫자/밑줄 4~20자" placeholder="영문/숫자/밑줄 4~20자">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" name="password" minlength="8" required placeholder="8자 이상">
      <div class="hint">안전을 위해 8자 이상, 다른 곳과 다른 비밀번호를 사용하세요.</div>
    </div>
    <button class="btn btn-primary" type="submit">가입하기</button>
  </form>

  <p class="auth-alt">이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
</main>
{% endblock %}

{% block bottom %}{% endblock %}
