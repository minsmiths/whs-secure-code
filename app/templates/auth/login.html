{% extends "base.html" %}
{% block title %}로그인 · Deuce Market{% endblock %}

{% block body %}
<main class="auth">
  <div class="auth-logo">🎾</div>
  <h1>Deuce Market</h1>
  <p class="auth-sub">테니스 용품 중고거래</p>

  <form class="form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>아이디</label>
      <input type="text" name="username" placeholder="아이디를 입력하세요" required autofocus>
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
    </div>
    <button class="btn btn-primary" type="submit">로그인</button>
  </form>

  <p class="auth-alt">아직 회원이 아니신가요? <a href="{{ url_for('auth.register') }}">회원가입</a></p>
</main>
{% endblock %}

{% block bottom %}{% endblock %}
